name = "lifesolver-backend"
main = "src/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
DB_PRIMARY = "d1"
DB_REPLICA = "turso"
TURSO_URL = "libsql://lifesolver-recreation-adnanshahria2006.aws-ap-south-1.turso.io"
AI_PROVIDER = "groq"
AI_FALLBACK = "workers-ai"
IMAGE_PROVIDER = "r2"
EMAIL_PROVIDER = "gmail"
GMAIL_USER = "adnanshahria2019@gmail.com"
GMAIL_FROM_NAME = "LifeSolver"
VECTOR_PROVIDER = "vectorize"
PAYMENT_PROVIDER = "stripe"
JWT_SECRET = "5f08a14af3f749be0682d562b88e690457eaa8b7c105798ffff6cc61d1a2d3b2"
ADMIN_SESSION_SECRET = "9635616a71afc3a2b694d004a8f8f2b8602d6346581263a386fefacb46408d0e"

# Cloudflare D1 Relational SQLite Database
[[d1_databases]]
binding = "DB"
database_name = "lifesolver-d1"
database_id = "e8e10bd0-7d62-4f4d-a775-5d488b21a0b8"

# Cloudflare Workers KV Cache
[[kv_namespaces]]
binding = "KV"
id = "57275317c39940e3b23366f6d090d47b"

# Cloudflare R2 Object Storage
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "lifesolver-r2"

# Cloudflare Workers AI
[ai]
binding = "AI"

# Cloudflare Vectorize Semantic Search Index
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "lifesolver-notes"

# Cloudflare Queues for Async Tasks & Background Sync
[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "lifesolver-notifications"

# Cloudflare Scheduled Cron Triggers
[triggers]
crons = ["0 2 * * 0", "0 1 * * *"]
